[project]
name = "RAG-against-the-machine"
authors = [ { name = "Ilai" } ]
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"pydantic",
	"langchain",
	"langchain-text-splitters",
	"bm25s[core]",
	"fire",
	"tqdm"
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.mypy]
ignore_missing_imports = true
exclude = [
	"data/*"
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = ["-p", "no:warnings"]

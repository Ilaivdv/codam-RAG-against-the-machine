[project]
name = "RAG-against-the-machine"
authors = [ { name = "Ilai Van der Veldt" } ]
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"langchain-text-splitters",
	"transformers",
	"bm25s[core]",
	"langchain",
	"pydantic",
	"torch",
	"fire",
	"tqdm"
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "torch-cpu" }

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.mypy]
ignore_missing_imports = true
exclude = [
	"data/*"
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = ["-p", "no:warnings"]
